openapi: 3.1.0
info:
  title: Linkrift API
  description: |
    Enterprise-grade URL shortener with analytics, custom domains, and team collaboration.

    ## Authentication

    Linkrift supports two authentication methods:

    - **Bearer Token (PASETO)**: Obtain tokens via `/auth/login` or `/auth/register`.
      Pass in the `Authorization: Bearer <token>` header.
    - **API Key**: Create API keys via the dashboard or API.
      Pass in the `X-API-Key: <key>` header.

    ## Response Format

    All responses follow a consistent envelope:

    ```json
    {
      "success": true,
      "data": { ... }
    }
    ```

    Error responses:

    ```json
    {
      "success": false,
      "error": {
        "code": "ERROR_CODE",
        "message": "Human-readable message"
      }
    }
    ```

    ## Workspace Scoping

    Most endpoints are scoped to a workspace via the `workspaceId` path parameter.
    Users must be members of the workspace with appropriate roles.

    ## Rate Limiting

    API requests are rate-limited. Rate limit headers are included in responses:
    - `X-RateLimit-Limit`
    - `X-RateLimit-Remaining`
    - `X-RateLimit-Reset`
  version: 1.0.0
  contact:
    name: Linkrift
    url: https://linkrift.io
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://api.linkrift.io/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Auth
    description: Authentication and session management
  - name: Workspaces
    description: Workspace management and team collaboration
  - name: Links
    description: URL shortening and link management
  - name: Domains
    description: Custom domain management
  - name: QR Codes
    description: QR code generation and customization
  - name: Analytics
    description: Click analytics and reporting
  - name: Bio Pages
    description: Link-in-bio page management
  - name: API Keys
    description: API key management for programmatic access
  - name: Webhooks
    description: Webhook management for event notifications
  - name: License
    description: Enterprise license management
  - name: Audit Logs
    description: Enterprise audit logging
  - name: Branding
    description: Enterprise white-label branding
  - name: SSO
    description: Enterprise SSO/SAML configuration
  - name: SCIM
    description: Enterprise SCIM 2.0 provisioning

security:
  - BearerAuth: []
  - APIKeyAuth: []

paths:
  # ──────────────────────────────────────────────
  # Auth
  # ──────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseEnvelope'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'

  # ──────────────────────────────────────────────
  # Workspaces
  # ──────────────────────────────────────────────
  /workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces for current user
      responses:
        '200':
          description: List of workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceResponse'
    post:
      tags: [Workspaces]
      summary: Create a new workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceInput'
      responses:
        '201':
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponseEnvelope'

  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: Get workspace details
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponseEnvelope'
    put:
      tags: [Workspaces]
      summary: Update workspace (Admin+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceInput'
      responses:
        '200':
          description: Workspace updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponseEnvelope'
    delete:
      tags: [Workspaces]
      summary: Delete workspace (Owner only)
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      summary: List workspace members
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkspaceMember'
    post:
      tags: [Workspaces]
      summary: Invite member (Admin+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberInput'
      responses:
        '201':
          description: Member invited

  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Workspaces]
      summary: Update member role (Admin+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [owner, admin, editor, viewer]
      responses:
        '200':
          description: Member role updated
    delete:
      tags: [Workspaces]
      summary: Remove member (Admin+)
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'

  /workspaces/{workspaceId}/transfer:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      summary: Transfer ownership (Owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_owner_id]
              properties:
                new_owner_id:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'

  # ──────────────────────────────────────────────
  # Links
  # ──────────────────────────────────────────────
  /workspaces/{workspaceId}/links:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Links]
      summary: List links
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: is_active
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated list of links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkListEnvelope'
    post:
      tags: [Links]
      summary: Create a short link (Editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkInput'
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponseEnvelope'

  /workspaces/{workspaceId}/links/bulk:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Links]
      summary: Bulk create links (Editor+, max 100)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [links]
              properties:
                links:
                  type: array
                  items:
                    $ref: '#/components/schemas/CreateLinkInput'
                  minItems: 1
                  maxItems: 100
      responses:
        '201':
          description: Links created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LinkResponse'

  /workspaces/{workspaceId}/links/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Links]
      summary: Get link details
      responses:
        '200':
          description: Link details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponseEnvelope'
    put:
      tags: [Links]
      summary: Update link (Editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLinkInput'
      responses:
        '200':
          description: Link updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponseEnvelope'
    delete:
      tags: [Links]
      summary: Delete link (Editor+)
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'

  /workspaces/{workspaceId}/links/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Links]
      summary: Get quick stats for a link
      responses:
        '200':
          description: Link quick stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/LinkQuickStats'

  # ──────────────────────────────────────────────
  # Domains
  # ──────────────────────────────────────────────
  /workspaces/{workspaceId}/domains:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Domains]
      summary: List custom domains
      responses:
        '200':
          description: List of domains
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Domain'
    post:
      tags: [Domains]
      summary: Add a custom domain (Editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDomainInput'
      responses:
        '201':
          description: Domain added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Domain'

  /workspaces/{workspaceId}/domains/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Domains]
      summary: Get domain details
      responses:
        '200':
          description: Domain details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Domain'
    delete:
      tags: [Domains]
      summary: Remove domain (Editor+)
      responses:
        '200':
          $ref: '#/components/responses/MessageResponse'

  /workspaces/{workspaceId}/domains/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Domains]
      summary: Verify domain DNS (Editor+)
      responses:
        '200':
          description: Domain verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Domain'

  /workspaces/{workspaceId}/domains/{id}/dns-records:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Domains]
      summary: Get DNS record instructions
      responses:
        '200':
          description: DNS record instructions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      records:
                        type: array
                        items:
                          $ref: '#/components/schemas/DNSRecordInstruction'

  # ──────────────────────────────────────────────
  # QR Codes
  # ──────────────────────────────────────────────
  /workspaces/{workspaceId}/links/{id}/qr:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [QR Codes]
      summary: Create QR code for link (Editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQRCodeInput'
      responses:
        '201':
          description: QR code created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/QRCodeResponse'
    get:
      tags: [QR Codes]
      summary: Get QR code for link
      responses:
        '200':
          description: QR code details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/QRCodeResponse'

  /workspaces/{workspaceId}/links/{id}/qr/download:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [QR Codes]
      summary: Download QR code image
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [png, svg, pdf]
            default: png
      responses:
        '200':
          description: QR code image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary

  /workspaces/{workspaceId}/qr/bulk:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [QR Codes]
      summary: Bulk generate QR codes (Editor+, max 50)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkQRCodeInput'
      responses:
        '200':
          description: ZIP file containing QR code images
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /workspaces/{workspaceId}/qr/templates:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [QR Codes]
      summary: Get QR code style templates
      responses:
        '200':
          description: Available style templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object

  # ──────────────────────────────────────────────
  # Analytics
  # ──────────────────────────────────────────────
  /workspaces/{workspaceId}/analytics/links/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Analytics]
      summary: Get link analytics summary
      parameters:
        - $ref: '#/components/parameters/DateRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Link analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/LinkAnalytics'

  /workspaces/{workspaceId}/analytics/links/{id}/timeseries:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Analytics]
      summary: Get click time series
      parameters:
        - $ref: '#/components/parameters/DateRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: interval
          in: query
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
      responses:
        '200':
          description: Time series data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeSeriesPoint'

  /workspaces/{workspaceId}/analytics/links/{id}/referrers:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Analytics]
      summary: Get referrer breakdown
      parameters:
        - $ref: '#/components/parameters/DateRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/AnalyticsLimit'
      responses:
        '200':
          description: Referrer stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReferrerStats'

  /workspaces/{workspaceId}/analytics/links/{id}/countries:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Analytics]
      summary: Get country breakdown
      parameters:
        - $ref: '#/components/parameters/DateRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/AnalyticsLimit'
      responses:
        '200':
          description: Country stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CountryStats'

  /workspaces/{workspaceId}/analytics/links/{id}/devices:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Analytics]
      summary: Get device breakdown
      parameters:
        - $ref: '#/components/parameters/DateRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Device breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DeviceBreakdown'

  /workspaces/{workspaceId}/analytics/links/{id}/browsers:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Analytics]
      summary: Get browser breakdown
      parameters:
        - $ref: '#/components/parameters/DateRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/AnalyticsLimit'
      responses:
        '200':
          description: Browser stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BrowserStats'

  /workspaces/{workspaceId}/analytics/workspace:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Analytics]
      summary: Get workspace-wide analytics
      parameters:
        - $ref: '#/components/parameters/DateRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Workspace analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/WorkspaceAnalytics'

  /workspaces/{workspaceId}/analytics/export:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Analytics]
      summary: Export analytics data
      parameters:
        - name: link_id
          in: query
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - $ref: '#/components/parameters/DateRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Export file
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: array
                items:
                  type: object

  # ──────────────────────────────────────────────
  # Bio Pages
  # ──────────────────────────────────────────────
  /workspaces/{workspaceId}/bio-pages:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Bio Pages]
      summary: List bio pages
      responses:
        '200':
          description: List of bio pages
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BioPage'
    post:
      tags: [Bio Pages]
      summary: Create bio page (Editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBioPageInput'
      responses:
        '201':
          description: Bio page created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BioPage'

  /workspaces/{workspaceId}/bio-pages/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ResourceId'
    get:
