{{- if .Values.redirect.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redirect
  labels:
    {{- include "linkrift.labels" . | nindent 4 }}
    app.kubernetes.io/name: redirect
    app.kubernetes.io/component: redirect
spec:
  {{- if not .Values.redirect.autoscaling.enabled }}
  replicas: {{ .Values.redirect.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: redirect
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redirect
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redirect
    spec:
      serviceAccountName: {{ include "linkrift.serviceAccountName" . }}
      containers:
        - name: redirect
          image: {{ include "linkrift.image" (dict "global" .Values.global "image" .Values.redirect.image "chartVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.redirect.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ add .Values.metrics.port 1 }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-linkrift-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.secretKeys.username }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.secretKeys.password }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.secretKeys.password }}
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.existingSecret }}
                  key: {{ .Values.clickhouse.secretKeys.username }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.existingSecret }}
                  key: {{ .Values.clickhouse.secretKeys.password }}
          {{- with .Values.redirect.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.redirect.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.redirect.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redirect
  labels:
    {{- include "linkrift.labels" . | nindent 4 }}
    app.kubernetes.io/name: redirect
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redirect.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.metrics.enabled }}
    - port: {{ add .Values.metrics.port 1 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    app.kubernetes.io/name: redirect
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.redirect.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-redirect
  labels:
    {{- include "linkrift.labels" . | nindent 4 }}
    app.kubernetes.io/name: redirect
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-redirect
  minReplicas: {{ .Values.redirect.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.redirect.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.redirect.autoscaling.targetCPUUtilization }}
    {{- if .Values.redirect.autoscaling.targetMemoryUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.redirect.autoscaling.targetMemoryUtilization }}
    {{- end }}
{{- end }}
{{- end }}
