global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Linkrift API service
  - job_name: "linkrift-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:9090"]
        labels:
          service: "api"
          environment: "production"

  # Linkrift Redirect service
  - job_name: "linkrift-redirect"
    metrics_path: /metrics
    static_configs:
      - targets: ["redirect:9091"]
        labels:
          service: "redirect"
          environment: "production"

  # Node exporter (host metrics)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # PostgreSQL exporter
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis exporter
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Kubernetes service discovery (when deployed to k8s)
  # Uncomment the following when using Prometheus Operator / kube-prometheus-stack
  # - job_name: "kubernetes-pods"
  #   kubernetes_sd_configs:
  #     - role: pod
  #   relabel_configs:
  #     - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
  #       action: keep
  #       regex: true
  #     - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
  #       action: replace
  #       target_label: __address__
  #       regex: (.+)
  #       replacement: ${1}
